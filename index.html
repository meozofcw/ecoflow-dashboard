<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOFLOW — Simulação Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--nav:#163d46;--nav2:#0e3038;--green:#39a94a;--green2:#53bd60;--mint:#e9f7ec;--yellow:#f5c51b;--red:#e64b43;--ink:#17252c;--muted:#60727a;--line:#e3eaed;--bg:#f5f8f9;--card:#fff;--shadow:0 4px 18px #19323d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button{font:inherit}.app{min-height:100vh}.topbar{height:106px;background:#fff;border-bottom:1px solid #dce4e7;display:flex;align-items:center;padding:0 30px;gap:25px}.brand{display:flex;align-items:center;gap:15px;min-width:480px}.brand img{width:65px;height:65px;object-fit:contain}.brand .eco{font-size:25px;font-weight:800;letter-spacing:.01em;color:#2d9d3a}.divider{height:38px;width:2px;background:#cbd5d8}.brand h1{font-size:25px;margin:0;font-weight:700}.topright{margin-left:auto;display:flex;align-items:center;gap:22px;color:#34434a;font-size:14px}.bell{font-size:24px;position:relative}.badge{position:absolute;right:-8px;top:-8px;background:#f5c51b;border-radius:50%;font-size:11px;padding:3px 6px;font-weight:800}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#173f48;color:#fff;display:grid;place-items:center;font-weight:700}.shell{display:grid;grid-template-columns:242px 1fr;min-height:calc(100vh - 106px)}.side{background:linear-gradient(180deg,var(--nav),var(--nav2));padding:22px 14px;color:#fff}.nav{display:grid;gap:6px}.nav a{color:#e9f1f3;text-decoration:none;padding:14px 13px;border-radius:6px;font-size:14px;display:flex;gap:13px;align-items:center}.nav a:hover,.nav a.active{background:#ffffff18}.nav a.active{box-shadow:inset 3px 0 #43d05b}.ico{width:20px;text-align:center;font-size:18px}.sideStatus{margin-top:95px;border:1px solid #ffffff38;border-radius:7px;padding:14px}.sideStatus small{display:block;color:#b8c8cb;font-size:10px;text-transform:uppercase}.sideStatus strong{display:block;color:#69e279;margin:9px 0}.sideStatus p{font-size:11px;line-height:1.7;color:#d0dcde;margin:0}.content{padding:22px 17px 0;overflow:hidden}.simbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.crumb{font-size:12px;color:#6d7e84}.simtag{background:#fff4c7;color:#806500;border:1px solid #f0d36b;padding:7px 12px;border-radius:7px;font-size:11px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:17px;min-height:125px}.metricTop{display:flex;align-items:center;gap:12px}.metricIcon{width:44px;height:44px;border-radius:50%;background:#e7f7e9;color:var(--green);display:grid;place-items:center;font-size:23px;font-weight:800}.metric label{font-size:11px;text-transform:uppercase;color:#45565d}.metric .num{font-size:25px;font-weight:700;margin-top:3px}.unit{font-size:13px;font-weight:500}.trend{margin-top:12px;font-size:10px;color:var(--green);font-weight:600}.down{color:#3b9d4c}.upbad{color:var(--red)}.mainGrid{display:grid;grid-template-columns:1.65fr 1.1fr .78fr;gap:15px;margin-top:15px}.panel{padding:17px;min-height:300px}.title{font-size:13px;font-weight:800;text-transform:uppercase;margin-bottom:14px}.title span{font-weight:500;text-transform:none;color:#718188}.chart{height:220px;position:relative}.chart svg{width:100%;height:100%}.axis{font-size:10px;fill:#708087}.barArea{height:220px;display:flex;align-items:flex-end;gap:18px;padding:20px 15px 25px;border-bottom:1px solid #d9e2e5}.bar{flex:1;background:#45a94e;border-radius:4px 4px 0 0;position:relative}.bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:#43545b}.bar.yellow{background:#f1bd20}.bar.red{background:#df554e}.barLabel{font-size:9px;color:#718188;text-align:center;margin-top:7px}.summary .srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e7edef;font-size:11px}.summary .srow:last-child{border:0}.sleft{display:flex;align-items:center;gap:9px}.mini{width:34px;height:34px;border-radius:50%;background:#edf8ee;display:grid;place-items:center;color:#36a447}.srow b{font-size:14px}.bottomGrid{display:grid;grid-template-columns:1.65fr 1.1fr .78fr;gap:15px;margin-top:15px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border:1px solid #e0e8eb;border-radius:10px;padding:14px}.flowStep{text-align:center;border-right:1px solid #d9e3e6;padding:5px}.flowStep:last-child{border:0}.flowIcon{font-size:27px;color:#315861}.flowStep strong{display:block;font-size:9px;margin:8px 0 4px}.flowStep span{font-size:8px;color:#75868c;line-height:1.4}.alerts .alertRow{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:12px 0;border-bottom:1px solid #e6edef}.alertIcon{font-size:21px}.aTitle{font-size:11px;font-weight:700}.aSub{font-size:9px;color:#7b898e;margin-top:4px}.aVal{font-size:12px;font-weight:700;color:var(--red)}.statusDonut{display:flex;align-items:center;gap:18px;margin-top:28px}.donut{width:105px;height:105px;border-radius:50%;background:conic-gradient(var(--green) 0 76%,var(--yellow) 76% 94%,var(--red) 94%);position:relative}.donut:after{content:"";position:absolute;inset:27px;background:#fff;border-radius:50%}.legend{font-size:10px;line-height:2}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}.foot{height:45px;background:#173e47;color:#e8f1f2;margin:15px -17px 0;padding:0 18px;display:flex;align-items:center;font-size:11px;justify-content:space-between}.controlWrap{max-width:1250px;margin:auto}.controlHero{padding:22px;background:linear-gradient(135deg,#fff,#eef7f1);border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;gap:20px;align-items:center}.controlHero h2{margin:0 0 5px;font-size:22px}.controlHero p{margin:0;color:var(--muted);font-size:12px}.controlStatus{background:#eaf8ed;border:1px solid #bfe5c5;border-radius:9px;padding:12px 18px;color:#278438;font-size:12px;font-weight:700}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.controls button{border:0;border-radius:9px;padding:15px 9px;font-size:11px;font-weight:800;cursor:pointer;min-height:72px;background:#e9f7ec;color:#277d35}.controls button:hover{filter:brightness(.97)}.controls .warn{background:#fff3c4;color:#785e00}.controls .danger{background:#ffe1df;color:#a6322c}.controls .dark{background:#173f48;color:#fff}.controls .gray{background:#e9eef0;color:#45565d}.controlGrid{display:grid;grid-template-columns:1.5fr .8fr;gap:14px;margin-top:14px}.log{padding:18px}.log table{width:100%;border-collapse:collapse;font-size:11px}.log th{text-align:left;color:#74848a;font-size:9px;text-transform:uppercase;padding:8px;border-bottom:1px solid #dde5e8}.log td{padding:10px 8px;border-bottom:1px solid #edf1f2}.machineBox{padding:18px}.machine{background:#123e45;color:#fff;border-radius:10px;padding:16px;margin-top:10px}.machine .big{font-size:22px;font-weight:700}.machine small{color:#b7cbcd}.machine .state{margin-top:10px;color:#ff7670;font-weight:800}.note{margin-top:10px;font-size:9px;color:#68797f;line-height:1.5}.legacy .content{padding-top:22px}.legacy .card{border-radius:4px;box-shadow:none}.legacy .side{background:#143b43}.legacy .metric{background:#f7fafb}.legacy .metricIcon{border-radius:4px;background:#e8f0f2;color:#1e5962}.legacy .title{font-family:Arial,sans-serif}.legacy .mainGrid,.legacy .bottomGrid{grid-template-columns:1.1fr 1.1fr 1fr}.legacy .simtag{background:#edf0f2;color:#4d5d62;border-color:#cbd5d8}.legacy .bar{background:#3f83bd}.legacy .brand .eco{color:#3e6971}.legacy .nav a.active{box-shadow:inset 3px 0 #56a8ba}.legacy .sideStatus strong{color:#91c3cb}.hidden{display:none!important}
@media(max-width:1100px){.brand{min-width:380px}.cards{grid-template-columns:repeat(3,1fr)}.mainGrid,.bottomGrid{grid-template-columns:1fr 1fr}.summary{grid-column:span 2}.controls{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.topbar{height:78px;padding:0 12px}.brand{min-width:0}.brand img{width:45px;height:45px}.brand h1{font-size:17px}.brand .eco{font-size:17px}.divider{height:25px}.topright{gap:8px;font-size:10px}.shell{grid-template-columns:1fr}.side{display:none}.content{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.mainGrid,.bottomGrid,.controlGrid{grid-template-columns:1fr}.summary{grid-column:auto}.controls{grid-template-columns:repeat(2,1fr)}.foot{margin:12px -12px 0}.flow{grid-template-columns:1fr 1fr}.flowStep:nth-child(2){border:0}.controlHero{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='ecoflow-demo-state-v3';
const base={mode:'normal',production:true,startedAt:Date.now(),logs:[['10:24:12','Produção iniciada','Sucesso'],['10:24:18','Máquinas operando normalmente','Normal']]};
function state(){try{return JSON.parse(localStorage.getItem(KEY))||base}catch{return base}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}
function now(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function addLog(s,e,st){s.logs=(s.logs||[]).slice(-8);s.logs.push([now(),e,st])}
function data(){let s=state(), t=(Date.now()-s.startedAt)/1000, ramp=Math.min(1,Math.max(0,t/8));let d={current:3.12,power:624,temp:36.8,prod:1248,energy:1.88,eff:89.7};if(!s.production)d.prod=0;
if(s.mode==='overload'){d.current=3.12+(1.78*ramp);d.power=624+(356*ramp);d.prod=Math.max(0,1248-Math.round(88*ramp));d.energy=1.88+(.91*ramp);d.eff=89.7-13*ramp}
if(s.mode==='mechanical'){d.current=3.12+2.15*ramp;d.power=624+430*ramp;d.prod=Math.max(0,1248-Math.round(142*ramp));d.energy=1.88+1.35*ramp;d.eff=89.7-18*ramp}
if(s.mode==='temperature'){d.current=3.12+.5*ramp;d.power=624+100*ramp;d.temp=36.8+17*ramp;d.prod=Math.max(0,1248-Math.round(60*ramp));d.energy=1.88+.35*ramp;d.eff=89.7-6*ramp}
return d}
function nav(page){location.hash=page;render()}
function layout(page,body,legacy=false){return '<div class="app '+(legacy?'legacy':'')+'"><header class="topbar"><div class="brand"><img src="/logo.svg"><span class="eco">ECOFLOW</span><span class="divider"></span><h1>'+(legacy?'Portal Industrial':'ECOFLOW Dashboard')+'</h1></div><div class="topright"><span class="bell">♧<span class="badge">'+(state().mode==='normal'?0:1)+'</span></span><span>▣ '+new Date().toLocaleDateString('pt-BR')+'</span><span>'+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</span><span class="user"><span class="avatar">EN</span> Engenheiro⌄</span></div></header><div class="shell"><aside class="side"><nav class="nav"><a href="#'+(legacy?'legacy':'eco')+'" class="'+(page==='main'?'active':'')"><span class="ico">⌂</span>Visão Geral</a><a href="#'+(legacy?'legacy':'eco')+'"><span class="ico">⌁</span>Monitoramento</a><a href="#'+(legacy?'legacy':'eco')+'"><span class="ico">♙</span>Máquinas</a><a href="#'+(legacy?'legacy':'eco')+'"><span class="ico">▥</span>Energia</a><a href="#'+(legacy?'legacy':'eco')+'"><span class="ico">△</span>Alertas <b style="margin-left:auto;background:#f5c51b;color:#554400;border-radius:12px;padding:2px 6px;font-size:9px">'+(state().mode==='normal'?0:1)+'</b></a><a href="#'+(legacy?'legacy':'eco')+'"><span class="ico">▤</span>Relatórios</a><a href="#control"><span class="ico">⚙</span>Central de Simulação</a></nav><div class="sideStatus"><small>Status do sistema</small><strong>● '+(state().mode==='normal'?'Operação Normal':'Ocorrência em andamento')+'</strong><p>'+(state().mode==='normal'?'Todos os sistemas funcionando dentro dos parâmetros.':'ECOFLOW identificou uma alteração no comportamento da máquina.')+'</p></div></aside><main class="content">'+body+'</main></div></div>'}
function metrics(d,eco=true){return '<section class="cards"><div class="card metric"><div class="metricTop"><div class="metricIcon">A</div><div><label>Current</label><div class="num">'+d.current.toFixed(2)+' <span class="unit">A</span></div></div></div><div class="trend '+(d.current>4?'upbad':'')+'">● '+(d.current>4?'Aumento detectado':'Phase Balanced')+'</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">ϟ</div><div><label>Estimated Power</label><div class="num">'+d.power.toLocaleString('pt-BR',{maximumFractionDigits:0})+' <span class="unit">W</span></div></div></div><div class="trend '+(d.power>800?'upbad':'')+'">● '+(d.power>800?'Live Alert':'Live Estimate')+'</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">♨</div><div><label>Temperature</label><div class="num">'+d.temp.toFixed(1)+' <span class="unit">°C</span></div></div></div><div class="trend '+(d.temp>45?'upbad':'')+'">● '+(d.temp>45?'Above Range':'Within Range')+'</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">▥</div><div><label>Production Count</label><div class="num">'+d.prod.toLocaleString('pt-BR')+' <span class="unit">pcs</span></div></div></div><div class="trend">● Today</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">⌁</div><div><label>Energy per Unit</label><div class="num">'+d.energy.toFixed(2)+' <span class="unit">Wh/pc</span></div></div></div><div class="trend '+(d.energy>2.5?'upbad':'down')+'">'+(d.energy>2.5?'↑ Aumento por anomalia':'↓ 8.3% vs yesterday')+'</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">◔</div><div><label>Machine Efficiency</label><div class="num">'+d.eff.toFixed(1)+'%</div></div></div><div class="trend '+(d.eff<80?'upbad':'')+'">● '+(d.eff<80?'Attention Required':'Good')+'</div></div></section>'}
function ecoPage(){let d=data(),s=state(), alert=s.mode!=='normal';let body='<div class="simbar"><div class="crumb">Overview / Real-time Monitoring</div><div class="simtag">⚠ DEMONSTRAÇÃO — DADOS SIMULADOS</div></div>'+metrics(d,true)+'<section class="mainGrid"><div class="card panel"><div class="title">Energy Consumption Over Time <span>(Simulação)</span></div><div class="chart"><svg viewBox="0 0 700 220" preserveAspectRatio="none"><g stroke="#e5ecee" stroke-width="1">'+[35,80,125,170,215].map(y=>'<line x1="25" y1="'+y+'" x2="680" y2="'+y+'"/>').join('')+'</g><polyline fill="none" stroke="'+(alert?'#e64b43':'#39a94a')+'" stroke-width="3" points="'+(alert?'25,185 90,180 155,170 220,150 285,125 350,100 415,82 480,72 545,58 610,42 680,30':'25,180 90,175 155,166 220,150 285,125 350,92 415,66 480,52 545,63 610,85 680,105')+'"/><g class="axis"><text x="25" y="213">08h</text><text x="180" y="213">10h</text><text x="335" y="213">12h</text><text x="490" y="213">14h</text><text x="640" y="213">16h</text></g></svg></div></div><div class="card panel"><div class="title">Mode Comparison <span>(Today)</span></div><div class="barArea"><div style="flex:1"><div class="bar" style="height:150px"><em>6.72 kWh</em></div><div class="barLabel">Normal</div></div><div style="flex:1"><div class="bar yellow" style="height:55px"><em>1.14 kWh</em></div><div class="barLabel">Anomalous</div></div><div style="flex:1"><div class="bar red" style="height:30px"><em>0.58 kWh</em></div><div class="barLabel">Intervention</div></div></div></div><div class="card panel summary"><div class="title" style="color:#3b9d45">Summary</div>'+[['ϟ','Total Energy (Today)','8.44 kWh'],['▥','Total Production',d.prod.toLocaleString('pt-BR')+' pcs'],['◔','Avg. Efficiency',d.eff.toFixed(1)+'%'],['⌁','CO₂ Savings (sim.)','5.62 kg'],['♙','Active Machines',s.production?'5 / 6':'0 / 6']].map(x=>'<div class="srow"><div class="sleft"><span class="mini">'+x[0]+'</span>'+x[1]+'</div><b>'+x[2]+'</b></div>').join('')+'</div></section><section class="bottomGrid"><div class="card panel"><div class="title">Process Flow: Data to Dashboard</div><div class="flow">'+[['♨','SENSORS','Temp, Current, Vibration, Power'],['▥','IOT GATEWAY','Data Collection & Transmission'],['☁','CLOUD / DATABASE','Secure Storage & Processing'],['⌕','ANALYTICS ENGINE','Anomaly Detection & Analysis'],['▣','DASHBOARD','Real-time Monitoring & Alerts']].map(x=>'<div class="flowStep"><div class="flowIcon">'+x[0]+'</div><strong>'+x[1]+'</strong><span>'+x[2]+'</span></div>').join('')+'</div></div><div class="card panel alerts"><div class="title">Active Alerts <span style="background:#e64b43;color:white;border-radius:10px;padding:3px 7px">'+(alert?1:0)+'</span></div>'+(alert?'<div class="alertRow"><div class="alertIcon">⚠</div><div><div class="aTitle">Padrão anormal detectado</div><div class="aSub">Máquina 02 • agora</div></div><div class="aVal">'+(s.mode==='temperature'?d.temp.toFixed(1)+' °C':d.power.toLocaleString('pt-BR')+' W')+'</div></div>':'<div class="alertRow"><div class="alertIcon">✓</div><div><div class="aTitle">Nenhuma ocorrência ativa</div><div class="aSub">Sistema dentro dos parâmetros</div></div><div style="color:#39a94a;font-weight:700">OK</div></div>')+'</div><div class="card panel"><div class="title" style="color:#3b9d45">Status Breakdown</div><div class="statusDonut"><div class="donut"></div><div class="legend"><span class="dot" style="background:#39a94a"></span>Normal 83.3%<br><span class="dot" style="background:#f5c51b"></span>Anomalous 11.7%<br><span class="dot" style="background:#e64b43"></span>Intervention 5.0%</div></div></div></section><div class="foot"><span>ECOFLOW v2.0 &nbsp; | &nbsp; Industry 4.0 &nbsp; • &nbsp; Energy Efficiency &nbsp; • &nbsp; Smart Monitoring</span><span>⚠ MODO DEMONSTRAÇÃO · SEM DADOS REAIS</span></div>';return layout('main',body,false)}
function legacyPage(){let d=data(),s=state();let body='<div class="simbar"><div class="crumb">Portal de Operações Industriais / Visão Geral</div><div class="simtag">SISTEMA LEGADO · SIMULAÇÃO</div></div><section class="cards"><div class="card metric"><div class="metricTop"><div class="metricIcon">▥</div><div><label>Produção do turno</label><div class="num">'+d.prod.toLocaleString('pt-BR')+' <span class="unit">unidades</span></div></div></div><div class="trend">▲ 12% vs. turno anterior</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">ϟ</div><div><label>Consumo energético</label><div class="num">8.742 <span class="unit">kWh</span></div></div></div><div class="trend">▲ 8% vs. turno anterior</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">⚙</div><div><label>Máquinas em operação</label><div class="num">'+(s.production?'5 / 6':'0 / 6')+'</div></div></div><div class="trend">1 em manutenção</div></div><div class="card metric"><div class="metricTop"><div class="metricIcon">!</div><div><label>Ocorrências registradas</label><div class="num">'+(s.mode==='normal'?3:4)+'</div></div></div><div class="trend '+(s.mode==='normal'?'':'upbad')">'+(s.mode==='normal'?'2 em análise | 1 resolvida':'1 nova ocorrência')+'</div></div><div class="card metric" style="grid-column:span 2"><div class="metricTop"><div class="metricIcon">⚠</div><div><label>Alertas do sistema</label><div style="font-size:11px;margin-top:6px">Ocorrência nº 0042 — Aumento de consumo<br>Ocorrência nº 0041 — Temperatura elevada<br>Ocorrência nº 0039 — Produção abaixo do esperado</div></div></div></div></section><section class="mainGrid"><div class="card panel"><div class="title">Consumo de Energia (kWh)</div><div class="barArea">'+[48,66,84,91,101,106,116].map((h,i)=>'<div style="flex:1"><div class="bar" style="height:'+h+'px"><em>'+([4.5,5.2,6.4,6.8,7.6,7.7,8.3][i])+'</em></div><div class="barLabel">'+['08h','10h','12h','14h','16h','18h','20h'][i]+'</div></div>').join('')+'</div></div><div class="card panel"><div class="title">Produção (unidades)</div><div class="chart"><svg viewBox="0 0 520 220"><polyline fill="none" stroke="#248b55" stroke-width="3" points="25,185 90,175 155,157 220,138 285,126 350,120 415,110 480,125"/><g fill="#248b55">'+[25,90,155,220,285,350,415,480].map((x,i)=>'<circle cx="'+x+'" cy="'+[185,175,157,138,126,120,110,125][i]+'" r="4"/>').join('')+'</g></svg></div></div><div class="card panel"><div class="title">Máquinas</div><div style="font-size:10px">'+['Máquina 01','Máquina 02','Máquina 03','Máquina 04','Máquina 05','Máquina 06'].map((m,i)=>'<div class="srow"><span>'+m+'</span><b style="color:'+(i===5?'#c99700':'#2e9144')+'">'+(i===5?'● Manutenção':'● Operando')+'</b></div>').join('')+'</div></div></section><section class="bottomGrid"><div class="card panel"><div class="title">Últimas ocorrências</div><table style="width:100%;font-size:10px;border-collapse:collapse"><tr style="color:#718188"><th style="text-align:left;padding:8px">ID</th><th style="text-align:left">Descrição</th><th>Horário</th><th>Status</th></tr>'+[['0042','Aumento de consumo','10:12','Em análise'],['0041','Temperatura elevada','09:47','Em análise'],['0039','Produção baixa','08:15','Resolvida'],['0038','Vibração anormal','07:32','Resolvida']].map(r=>'<tr>'+r.map(c=>'<td style="padding:8px;border-top:1px solid #e6edef">'+c+'</td>').join('')+'</tr>').join('')+'</table></div><div class="card panel"><div class="title">Sistema</div><p style="font-size:12px;line-height:1.7;color:#5d6e75">Este portal representa uma operação industrial sem a camada de análise do ECOFLOW. As informações são apresentadas de forma fragmentada e as ocorrências dependem de acompanhamento manual.</p></div><div class="card panel"><div class="title">Status</div><div style="font-size:18px;color:#2e9144;font-weight:700">● Operação Normal</div><p style="font-size:10px;color:#718188">A fábrica continua operando mesmo quando alterações de consumo são registradas.</p></div></section><div class="foot"><span>PORTAL INDUSTRIAL v1.0 &nbsp; | &nbsp; Fábrica Alta</span><span>SIMULAÇÃO PARA DEMONSTRAÇÃO</span></div>';return layout('main',body,true)}
function controlPage(){let s=state(),d=data();let modeLabel={normal:'OPERAÇÃO NORMAL',overload:'SOBRECARGA',mechanical:'FALHA MECÂNICA',temperature:'TEMPERATURA ELEVADA'}[s.mode];let rows=(s.logs||[]).slice().reverse().map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><b style="color:'+(r[2]==='Normal'||r[2]==='Sucesso'?'#329546':r[2].includes('andamento')?'#d08d00':'#d7443e')+'">'+r[2]+'</b></td></tr>').join('');let body='<div class="controlWrap"><div class="simbar"><div class="crumb">ECOFLOW / Central de Controle</div><div class="simtag">ACESSO DA EQUIPE</div></div><div class="controlHero"><div><h2>Central de Controle — Simulação</h2><p>Gerencie as ocorrências para demonstrar o comportamento proposto do ECOFLOW.</p></div><div class="controlStatus">● Sistema de demonstração<br><small>Estado: '+modeLabel+'</small></div></div><div class="controls"><button class="dark" onclick="startProd()">▶ INICIAR<br>PRODUÇÃO</button><button class="warn" onclick="occ('overload','Ocorrência #004 — aumento de consumo')">⚠ SIMULAR<br>SOBRECARGA</button><button class="warn" onclick="occ('mechanical','Ocorrência #005 — resistência mecânica')">⚠ SIMULAR<br>FALHA MECÂNICA</button><button class="warn" onclick="occ('temperature','Ocorrência #006 — temperatura elevada')">⚠ SIMULAR<br>AUMENTO DE CONSUMO</button><button class="danger" onclick="finish()">■ FINALIZAR<br>OCORRÊNCIA</button></div><div class="controls" style="grid-template-columns:1fr;margin-top:10px"><button class="gray" onclick="resetDemo()">↻ RESETAR SIMULAÇÃO</button></div><div class="controlGrid"><div class="card log"><div class="title">Log da simulação</div><table><thead><tr><th>Horário</th><th>Evento</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="card machineBox"><div class="title">Detalhes da simulação</div><div class="machine"><small>Máquina 02</small><div class="big">Linha de produção</div><div class="state">'+(s.mode==='normal'?'● NORMAL':'▲ '+modeLabel)+'</div><div style="margin-top:12px;font-size:10px">Corrente: '+d.current.toFixed(2)+' A<br>Potência: '+d.power.toFixed(0)+' W<br>Energia/unidade: '+d.energy.toFixed(2)+' Wh/pc</div></div><p class="note">Os valores apresentados nesta central são simulados e servem exclusivamente para demonstrar o conceito da plataforma. Não representam medições reais do protótipo físico.</p></div></div></div>';return layout('control',body,false)}
function startProd(){let s=state();s.production=true;s.startedAt=Date.now();addLog(s,'Produção iniciada','Sucesso');save(s)}
function occ(m,msg){let s=state();s.mode=m;s.startedAt=Date.now();s.production=true;addLog(s,msg,'Em andamento');save(s)}
function finish(){let s=state();s.mode='normal';s.startedAt=Date.now();addLog(s,'Intervenção simulada — processo normalizado','Sucesso');save(s)}
function resetDemo(){localStorage.removeItem(KEY);render()}
function render(){let p=location.hash.replace('#','')||'eco';if(p==='control')document.getElementById('app').innerHTML=controlPage();else if(p==='legacy')document.getElementById('app').innerHTML=legacyPage();else document.getElementById('app').innerHTML=ecoPage()}
window.addEventListener('hashchange',render);window.addEventListener('storage',render);render();setInterval(()=>{if(location.hash!=='#control')render();},1000);
</script>
